<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página Web</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #24292e;
            color: #ffffff;
            padding: 2rem;
            text-align: center;
        }
        main {
            flex: 1;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: #ffffff;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        footer {
            text-align: center;
            padding: 1rem;
            background-color: #e1e4e8;
            color: #586069;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>¡Página de Prueba en GitHub Pages!</h1>
    </header>

    <main>
        <div class="card">
            <h2>Bienvenido</h2>
            <p>Este es un diseño básico en HTML y CSS para probar la publicación de un sitio web en línea.</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Creado para probar GitHub</p>
    </footer>

</body>
</html>
